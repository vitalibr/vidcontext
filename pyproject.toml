[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidcontext"
version = "0.1.0"
description = "Real transcription and screenshot extraction from YouTube videos or local files, for an AI agent to read and analyze. Calls no AI API itself."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "yt-dlp>=2024.7",
    "youtube-transcript-api>=0.6.2",
    "faster-whisper>=1.0",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-yt-dlp",
]

[project.scripts]
vidcontext = "vidcontext.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() as default values is the documented Typer idiom.
"src/vidcontext/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vidcontext"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
